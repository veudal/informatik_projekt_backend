name: Trigger Render Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-slim
    steps:
      - name: Hit Render Webhook
        run: wget -qO- "$RENDER_DEPLOY_HOOK_URL" > /dev/null
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}